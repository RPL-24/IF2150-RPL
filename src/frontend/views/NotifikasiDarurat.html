<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MahaSehat - Notifikasi Darurat</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="NotifikasiDarurat.css">
    </head>
    <body>
        <div class="notif-container">
            <div class="notif-card" id="Card_Darurat">
                <div class="darurat-icon" id="Icon_Darurat">
                    <img src="..\assets\darurat.png" alt="Darurat Icon"/>
                </div>

                <p id="Title_Darurat">Peringatan Darurat Kesehatan Mental!</p>
                <p id="Desc_Darurat">Pelajar tidak melakukan check-in selama 3 hari berturut-turut dan rata-rata mood berada di bawah ambang batas aman. Segera lakukan tindak lanjut dan hubungi pelajar.</p>

                <div class="button-group">
                    <button type="button" class="btn-action" id="Btn_Diterima">Diterima</button>
                    <button type="button" class="btn-action" id="Btn_SudahDitindaklanjuti">Sudah Ditindaklanjuti</button>
                </div>
            </div>
        </div>

        <script src="NotifikasiDarurat.js"></script>
    </body>
</html>
