version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fajartech_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rahasia123}
      POSTGRES_DB: ${POSTGRES_DB:-fajartech}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: