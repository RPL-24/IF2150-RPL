<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MahaSehat - Dashboard</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
        <style>
            *{ box-sizing: border-box; margin: 0; padding: 0; font-family: 'DM Sans', sans-serif; }
            body{ background-color: #FFFDF7; color: #2A3A3F; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
            #Panel_PilihPeran{ width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
            h1{ font-family: 'Space Grotesk', sans-serif; font-size: 28px; }
            p{ font-size: 15px; margin-bottom: 8px; }
            button{ padding: 12px; border: none; border-radius: 16px; background-color: #F8C16F; color: #2A3A3F; font-size: 18px; font-weight: 600; cursor: pointer; }
            button:hover{ background-color: #ffa70e; }
            button:focus-visible{ outline: 2px solid #2A3A3F; outline-offset: 2px; }
        </style>
    </head>
    <body>
        <main id="Panel_PilihPeran" hidden>
            <h1 id="Title_PilihPeran">Masuk sebagai</h1>
            <p id="Text_PilihPeran">Pilih peran untuk membuka dashboard.</p>
            <button type="button" id="Btn_Pelajar" data-role="pelajar">Pelajar</button>
            <button type="button" id="Btn_OrangTuaWali" data-role="orangtuawali">Orang Tua/Wali</button>
            <button type="button" id="Btn_TenagaKesehatan" data-role="tenagakesehatan">Tenaga Kesehatan</button>
        </main>

        <script>
            const HALAMAN_PER_ROLE = {
                pelajar: 'DashboardPagePelajar.html',
                orangtuawali: 'DashboardPageOrangTuaWali.html',
                orangtua: 'DashboardPageOrangTuaWali.html',
                wali: 'DashboardPageOrangTuaWali.html',
                tenagakesehatan: 'DashboardPageTenagaKesehatan.html'
            };

            function normalisasiRole(role) {
                return (role || '').toLowerCase().replace(/[^a-z]/g, '');
            }

            function pindahKeDashboard(role) {
                const tujuan = HALAMAN_PER_ROLE[role];
                if (!tujuan) return false;
                localStorage.setItem('role', role);
                window.location.replace(tujuan);
                return true;
            }

            const params = new URLSearchParams(window.location.search);
            const roleAwal = normalisasiRole(params.get('role') || localStorage.getItem('role'));

            if (!pindahKeDashboard(roleAwal)) {
                document.getElementById('Panel_PilihPeran').hidden = false;
            }

            document.querySelectorAll('#Panel_PilihPeran button').forEach((btn) => {
                btn.addEventListener('click', () => pindahKeDashboard(btn.dataset.role));
            });
        </script>
    </body>
</html>
