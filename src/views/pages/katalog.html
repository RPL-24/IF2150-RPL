<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0F4C97">
  <title>Katalog · ITBELI</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/listing.css">
  <link rel="stylesheet" href="/css/katalog.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/ListingUI.js" defer></script>
  <script src="/js/layoutKatalog.js" defer></script>
  <script src="/js/KartuProduk.js" defer></script>
  <script src="/js/HalamanKatalog.js" defer></script>
  <script src="/js/PanelNotifikasi.js" defer></script>
</head>
<body>
<div class="page">
  <header id="listing-topbar" class="topbar"></header>
  <div class="shell">
    <aside id="listing-rail" class="rail"></aside>
    <main class="content">
      <div class="content__inner col gap-5">
        <div>
          <h1 class="h-page">Katalog</h1>
          <p class="muted mt-2">Barang preloved dari sivitas ITB</p>
        </div>

        <form id="form-filter" class="panel filter-katalog" aria-label="Saring katalog">
          <label class="filter-katalog__field">
            <span>Kategori</span>
            <select name="kategori"><option value="">Semua kategori</option></select>
          </label>
          <label class="filter-katalog__field">
            <span>Lokasi COD</span>
            <select name="lokasi"><option value="">Semua lokasi</option></select>
          </label>
          <label class="filter-katalog__field">
            <span>Harga minimum (Rp)</span>
            <input type="number" name="hargaMin" min="0" step="1000" inputmode="numeric" placeholder="0">
          </label>
          <label class="filter-katalog__field">
            <span>Harga maksimum (Rp)</span>
            <input type="number" name="hargaMaks" min="0" step="1000" inputmode="numeric" placeholder="Tanpa batas">
          </label>
          <label class="filter-katalog__field">
            <span>Urutkan</span>
            <select name="urut">
              <option value="terbaru">Terbaru</option>
              <option value="termurah">Harga terendah</option>
              <option value="termahal">Harga tertinggi</option>
            </select>
          </label>
          <div class="filter-katalog__aksi">
            <button type="submit" class="btn btn--primer btn--sm">Terapkan</button>
            <button type="button" id="reset-filter" class="btn btn--sekunder btn--sm">Reset</button>
          </div>
        </form>

        <div id="galat-umum" class="infobox infobox--galat" role="alert" hidden></div>
        <p id="info-hasil" class="muted" aria-live="polite"></p>
        <p id="memuat" class="muted">Memuat katalog…</p>
        <div id="daftar-katalog" class="grid"></div>

        <div id="katalog-kosong" class="panel kosong" hidden>
          <h2 class="h-sec" id="kosong-judul">Barang tidak ditemukan</h2>
          <p class="muted mt-2" id="kosong-teks">Coba kata kunci lain atau ubah filter pencarian.</p>
          <button type="button" id="kosong-reset" class="btn btn--sekunder mt-4">Hapus pencarian &amp; filter</button>
        </div>

        <nav id="paginasi" class="paginasi-katalog" aria-label="Navigasi halaman katalog" hidden>
          <button type="button" id="hal-sebelum" class="btn btn--sekunder btn--sm">‹ Sebelumnya</button>
          <span id="hal-info" class="muted"></span>
          <button type="button" id="hal-berikut" class="btn btn--sekunder btn--sm">Berikutnya ›</button>
        </nav>
      </div>
    </main>
  </div>
  <div id="pesan" class="toast" role="status" hidden></div>
</div>
</body>
</html>
