<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MahaSehat - Registrasi Orang Tua/Wali</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="RegistrationPage.css">
    </head>
    <body>
        <div class="auth-container">
            <aside class="panel-left" id=""Panel_Left>
                <div class="logo-container" id="Logo_App">
                    <img src="C:\Users\Lenovo\OneDrive\Documents\GitHub\IF2150-RPL-K03-G04\src\frontend\assets\logo-mahasehat.png" alt="Logo MahaSehat" class="logo-img">
                </div>

                <div class="greeting-box">
                    <h1 id="Text_Greeting">Selamat Datang!</h1>
                </div>
            </aside>

            <main class="panel-right" id="Panel_Right">
                <div class="form-card">
                    <h1 id="Title_Registrasi">Daftarkan Akun Anda</h1>
                </div>

                <div class="role-tabs" id="Tab_RoleGroup">
                    <button type="button" class="tab-btn" id="Tab_Role_Pelajar" data-role="pelajar">Pelajar</button>
                    <button type="button" class="tab-btn active" id="Tab_Role_OrangTuaWali" data-role="orangtuawali">Orang Tua/Wali</button>
                    <button type="button" class="tab-btn" id="Tab_Role_TenagaKesehatan" data-role="tenagakesehatan">Tenaga Kesehatan</button>
                </div>

                <form id="Form_Registration" novalidate>
                    <input type="hidden" id="Input_Role" name="role" value="orangtuawali">

                    <div class="form-group">
                        <label id="Label_Nama" for="Input_Nama">Nama</label>
                        <input type="text" id="Input_Nama" name="nama" placeholder="Nama" required>
                        <small class="error-msg" id="Error_Nama"></small>
                    </div>

                    <div class="form-group">
                        <label id="Label_Email" for="Input_Email">Email</label>
                        <input type="email" id="Input_Email" name="email" placeholder="Email" required>
                        <small class="error-msg" id="Error_Email"></small>
                    </div>

                    <div class="form-group">
                        <label id="Label_NomorTelp" for="Input_NomorTelp">Nomor Telepon</label>
                        <input type="tel" id="Input_NomorTelp" name="nomor_telp" placeholder="Nomor Telepon" required>
                        <small class="error-msg" id="Error_NoTelepon"></small>
                    </div>

                    <div class="form-group-row">
                        <div class="form-group">
                            <label for="Input_KataSandi">Kata Sandi</label>
                            <input type="password" id="Input_KataSandi" name="password" placeholder="Kata Sandi (Min. 8 karakter)" required>
                        </div>
                        <div class="form-group">
                            <label for="Input_KonfirmasiKataSandi">Konfirmasi Kata Sandi</label>
                            <input type="password" id="Input_KonfirmasiKataSandi" name="confirm_password" placeholder="Konfirmasi Kata Sandi" required>
                        </div>
                    </div>

                    <div id="Alert_Error" class="alert-box alert-danger" style="display: none;"></div>

                    <button type="submit" class="btn-primary" id="Btn_Daftar">Daftar</button>
                </form>

                <p class="login-link">Sudah punya akun? <a href=login.html><span class="text-highlight">Masuk</span></a></p>
            </main>
        </div>
        <script src="C:\Users\Lenovo\OneDrive\Documents\GitHub\IF2150-RPL-K03-G04\src\frontend\views\RegistrationPageOrangTuaWali.js"></script>
    </body>
</html>
