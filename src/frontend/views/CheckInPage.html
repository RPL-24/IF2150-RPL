<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MahaSehat - Check In Harian</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS bersama, lalu CSS halaman -->
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="CheckInPage.css">
</head>
<body>
    <div class="site-wrapper">
        <header class="site-header">
            <a class="brand-link" href="DashboardPagePelajar.html">
                <img src="../assets/logo-mahasehat-v1.png" alt="Logo MahaSehat" class="brand-logo">
            </a>
            <button class="btn btn--link" id="btn-close" type="button">Tutup</button>
        </header>

        <main class="main-viewport" id="checkin-content" aria-live="polite"></main>

        <footer class="site-footer">
            <p>&copy; 2026 MahaSehat. Catatan refleksimu dienkripsi dan hanya terlihat olehmu.</p>
        </footer>
    </div>

    <script src="session.js"></script>
    <script src="CheckInPage.js"></script>
    <script>
        (function () {
            const TOKEN_KEY = 'mahasehat_token';
            const token = localStorage.getItem(TOKEN_KEY);

            // Halaman ini butuh sesi; tanpa token langsung balik ke login.
            if (!token) {
                window.location.href = 'LoginPage.html';
                return;
            }

            let pengguna = {};
            try {
                pengguna = JSON.parse(localStorage.getItem('mahasehat_user') || '{}');
            } catch (e) {
                pengguna = {};
            }

            const MEAL_LABEL = {
                teratur: 'Teratur',
                kurang: 'Kurang teratur',
                tidak: 'Tidak teratur'
            };

            const nama = String(pengguna.nama || '').trim().split(' ')[0] || 'Pelajar';
            const keDashboard = () => {
                window.location.href = 'DashboardPagePelajar.html?checkin=sudah';
            };

            CheckInPage.init({
                name: nama,
                onSubmit: async (payload) => {
                    const respons = await fetch('/api/check-in', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            Authorization: `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            mood: payload.mood,
                            sleep: { bed: payload.sleep.bed, wake: payload.sleep.wake },
                            meal: MEAL_LABEL[payload.meal] || payload.meal,
                            triggers: payload.triggers || [],
                            note: payload.note
                        })
                    });
                    const hasil = await respons.json().catch(() => ({}));

                    if (respons.status === 401) {
                        localStorage.removeItem(TOKEN_KEY);
                        window.location.href = 'LoginPage.html';
                        throw new Error('Sesi kamu sudah berakhir. Silakan masuk lagi.');
                    }
                    if (!respons.ok) {
                        throw new Error(hasil.message || 'Check-in gagal disimpan.');
                    }
                    return hasil;
                },
                onClose: keDashboard,
                onDone: keDashboard
            });
        })();
    </script>
</body>
</html>
