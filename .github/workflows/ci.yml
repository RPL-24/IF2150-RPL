name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: silembur
          POSTGRES_PASSWORD: silembur
          POSTGRES_DB: silembur_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U silembur"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://silembur:silembur@localhost:5432/silembur_test

  mobile-bundle:
    name: Mobile bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - name: Bundle Android
        working-directory: src/mobile
        run: npx expo export --platform android --output-dir ${{ runner.temp }}/expo-android
      - name: Bundle iOS
        working-directory: src/mobile
        run: npx expo export --platform ios --output-dir ${{ runner.temp }}/expo-ios
