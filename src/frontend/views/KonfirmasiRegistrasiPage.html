<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MahaSehat - Persetujuan Orang Tua/Wali</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="KonfirmasiRegistrasiPage.css">
    </head>
    <body>
        <div class="approval-container">
            <aside class="panel-left" id=""Panel_Left>
                <div class="logo-container" id="Logo_App">
                    <img src="../assets/logo-mahasehat.png" alt="Logo MahaSehat" class="logo-img">
                </div>

                <div class="greeting-box">
                    <h1 id="Text_Greeting">Selamat Datang!</h1>
                </div>
            </aside>

            <main class="panel-right" id="Panel_Right">
                <div class="form-content">
                    <h1 id="Title_Persetujuan">Persetujuan Orang Tua/Wali</h1>

                    <div class="data-grid">
                        <div class="data-row">
                            <span class="data-label" id="Label_NamaPelajar">Nama Pelajar</span>
                            <span class="data-value" id="Text_ValNamaPelajar">Budi Santoso</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label" id="Label_EmailPelajar">Email Pelajar</span>
                            <span class="data-value" id="Text_ValEmailPelajar">Budi Santoso89@gmail.com</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label" id="Label_NomorTelpPelajar">Nomor Telepon Pelajar</span>
                            <span class="data-value" id="Text_ValueNomorTelpPelajar">081939326802</span>
                        </div>
                    </div>

                    <div class="note-section">
                        <p class="note-title" id="Label_Catatan">Catatan:</p>
                        <p class="note-desc" id="Text_Catatan">Orang tua/wali dapat mengelola status persetujuan akun, tetapi catatan pribadi pelajar dijaga kerahasiaannya</p>
                    </div>

                    <div class="button-group">
                        <button type="button" class="btn-secondary" id="Btn_TidakSetuju">Tidak setuju</button>
                        <button type="button" class="btn-primary" id="Btn_Setuju">Setuju</button>
                    </div>
                </div>
            </main>
        </div>

        <script src="KonfirmasiRegistrasiPage.js"></script>
    </body>
</html>
