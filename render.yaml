# Blueprint Render untuk server API SILEMBUR (uji coba deploy, paket gratis).
# Panduan lengkap: src/README.md bagian "Deploy uji coba (Render + Neon + Google Cloud Storage)".
#
# Nilai rahasia TIDAK ditulis di sini (repo publik): yang bertanda `sync: false` diisi di dashboard Render.
# File kunci service account Google Cloud diunggah sebagai Secret File bernama `gcs-key.json`
# (Render menaruhnya di /etc/secrets/gcs-key.json).
services:
  - type: web
    name: silembur-api
    runtime: node
    plan: free
    region: singapore
    branch: feat/implementation
    rootDir: src
    # Hanya pasang dependensi server (+ @silembur/shared), tanpa dependensi Expo/mobile.
    buildCommand: npm ci --workspace server && npm run db:migrate
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: gcs
      - key: GCS_BUCKET
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/gcs-key.json
      - key: GOOGLE_MAPS_API_KEY
        sync: false
