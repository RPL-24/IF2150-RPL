# PostgreSQL 18 lokal untuk pengembangan dan pengujian.
# Kredensial di bawah hanya untuk mesin lokal (data fiktif), bukan rahasia produksi.
services:
  db:
    image: postgres:18
    container_name: silembur-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-silembur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-silembur}
      POSTGRES_DB: ${POSTGRES_DB:-silembur}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - silembur-db:/var/lib/postgresql
      - ./server/src/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-silembur}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  silembur-db:
