# Memperbarui issue "📊 Issue Tracker ITBELI" dan menutup issue yang dirujuk PR saat di-merge ke develop.
# Logika ada di .github/scripts/issue-tracker.js
name: issue-tracker

on:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled]
  # pull_request_target memakai workflow dari branch tujuan PR dan tidak menjalankan kode PR
  pull_request_target:
    types: [opened, reopened, closed, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: issue-tracker
  cancel-in-progress: false

jobs:
  perbarui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const jalankan = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-tracker.js`);
            await jalankan({ github, context, core });
