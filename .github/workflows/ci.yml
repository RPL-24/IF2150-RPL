name: CI

"on":
  push:
    branches:
      - Development
  pull_request:
    branches:
      - Development

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r src/backend/requirements.txt

      - name: Run backend tests
        working-directory: src/backend
        run: python -m pytest

  frontend:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r src/backend/requirements.txt

      - name: Seed demo data for E2E tests
        working-directory: src/backend
        run: python seed.py

      - name: Start backend for E2E tests
        working-directory: src
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Run frontend tests
        working-directory: src/frontend
        run: npm test

      - name: Run frontend lint
        working-directory: src/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build
