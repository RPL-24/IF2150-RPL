<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MahaSehat - Check In Harian</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS bersama, lalu CSS halaman -->
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="CheckInPage.css">
</head>
<body>
    <div class="site-wrapper">
        <header class="site-header">
            <a class="brand-link" href="DashboardPagePelajar.html">
                <img src="../assets/logo-mahasehat.png" alt="Logo MahaSehat" class="brand-logo">
                <span class="brand-title">MahaSehat</span>
            </a>
            <button class="btn btn--link" id="btn-close" type="button">Tutup</button>
        </header>

        <main class="main-viewport" id="checkin-content" aria-live="polite"></main>

        <footer class="site-footer">
            <p>&copy; 2026 MahaSehat. Catatan refleksimu dienkripsi dan hanya terlihat olehmu.</p>
        </footer>
    </div>

    <script src="CheckInPage.js"></script>
    <script>
        (function () {
            let pengguna = {};
            try {
                pengguna = JSON.parse(localStorage.getItem('mahasehat_user') || '{}');
            } catch (e) {
                pengguna = {};
            }

            const nama = String(pengguna.nama || '').trim().split(' ')[0] || 'Pelajar';
            const keDashboard = () => {
                window.location.href = 'DashboardPagePelajar.html';
            };

            CheckInPage.init({
                name: nama,
                onSubmit: async (payload) => {
                    // TODO(integrasi): ganti dengan request ke POST /api/check-in
                    console.log('Payload check-in:', payload);
                },
                onClose: keDashboard,
                onDone: keDashboard
            });
        })();
    </script>
</body>
</html>
